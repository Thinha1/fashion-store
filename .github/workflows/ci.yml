name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pint + PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    # GitHub Actions waits for this service's health check to pass before
    # any step below runs, so no separate "wait for mysql" step is needed.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fashion_store
          MYSQL_USER: fashion_store
          MYSQL_PASSWORD: fashion_store
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # phpunit.xml pins DB_CONNECTION=sqlite/:memory: for fast, isolated local
    # test runs, but its <env> entries don't set force="true" — so they only
    # apply when a variable isn't already set. Exporting DB_* here at the job
    # level makes both `artisan migrate` and `artisan test` below target the
    # MySQL service instead, matching the production/dev database engine.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fashion_store
      DB_USERNAME: fashion_store
      DB_PASSWORD: fashion_store

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, zip
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build front-end assets
        run: npm run build

      - name: JavaScript tests
        run: node --test tests/JavaScript/*.test.js

      - name: Run migrations
        run: php artisan migrate --force

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPUnit with coverage
        run: |
          mkdir -p build/coverage build/test-results
          php artisan test --compact \
            --coverage-clover=build/coverage/clover.xml \
            --log-junit=build/test-results/phpunit.xml

      - name: Check SonarQube token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not configured; SonarQube analysis was skipped."
          fi

      - name: SonarQube Scan
        if: steps.sonar-token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
