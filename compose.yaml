name: fashion-store

x-laravel-service: &laravel-service
  build:
    context: .
    dockerfile: .docker/php/Dockerfile
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
    - vendor:/var/www/html/vendor
    - storage:/var/www/html/storage
    - bootstrap_cache:/var/www/html/bootstrap/cache
  environment:
    TZ: Asia/Ho_Chi_Minh
  depends_on:
    setup:
      condition: service_completed_successfully
    mysql:
      condition: service_healthy

services:
  setup:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    working_dir: /var/www/html
    command: ["sh", ".docker/bin/setup.sh"]
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - ./.docker/composer-cache:/tmp/composer/cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer/cache

  migrate:
    <<: *laravel-service
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"

  app:
    <<: *laravel-service
    command: ["php-fpm"]
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_FORWARD_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - storage:/var/www/html/storage:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fashion_store}
      MYSQL_USER: ${DB_USERNAME:-fashion_store}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fashion_store}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    init: true
    ports:
      - "${VITE_FORWARD_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

  queue:
    <<: *laravel-service
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *laravel-service
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  bootstrap_cache:
  mysql_data:
  node_modules:
  storage:
  vendor:
    name: fashion-store-vendor
