server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 24m;

    # Docker's embedded DNS. Combined with the $upstream_app variable below,
    # this makes nginx re-resolve the `app` hostname every 10s instead of
    # caching whatever IP it had at worker startup — otherwise recreating the
    # app container (e.g. after any compose.yaml change) leaves nginx stuck
    # pointing at the old, now-dead IP until it's restarted (502s).
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        set $upstream_app app;
        fastcgi_pass $upstream_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
